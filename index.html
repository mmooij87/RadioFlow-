<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RadioFlow</title>
  <meta name="description" content="Hear what radio stations around the world played in the last 24 hours. Tune in, swipe, save what you love." />
  <meta name="theme-color" content="#2A2622" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RadioFlow" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://is1-ssl.mzstatic.com" crossorigin />
</head>
<body>
  <header class="topbar">
    <span class="wordmark" aria-label="RadioFlow"><span class="wordmark__dot"></span>RadioFlow</span>
    <div class="topbar__actions">
      <button class="round-btn" id="settings-btn" aria-label="Settings and stations" aria-haspopup="dialog">
        <span data-icon="tune" data-size="22"></span>
      </button>
      <button class="saved-btn" id="saved-btn" aria-label="Saved songs" aria-haspopup="dialog">
        <span class="saved-btn__icon" data-icon="heart"></span>
        <span class="saved-btn__count" id="saved-count">0</span>
      </button>
    </div>
  </header>

  <main class="feed" id="feed" aria-label="Songs" tabindex="-1"></main>

  <div class="swipe-hint" id="swipe-hint" role="status" hidden></div>

  <nav class="dial" id="dial" aria-label="Stations"></nav>

  <dialog class="sheet" id="saved-sheet" aria-labelledby="sheet-title"></dialog>
  <dialog class="sheet sheet--tall" id="settings-sheet" aria-labelledby="settings-title"></dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <audio id="audio-player" preload="metadata" playsinline></audio>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
